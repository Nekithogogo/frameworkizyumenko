{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CertHub{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="ch-header mb-4">
        <div class="container d-flex align-items-center flex-wrap gap-3">
            <a href="{% url 'homepage:index' %}" class="ch-brand">
                <img
                    src="{% static 'homepage/img/logo.png' %}"
                    alt="CertHub"
                    class="ch-logo"
                >
                CertHub
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="container ch-footer">
        <p>
            © <span id="current-year"></span> CertHub —
            сервис управления SSL-сертификатами
        </p>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
