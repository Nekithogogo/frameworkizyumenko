{% if status == "active" %}
    <span class="badge bg-success certificate-status">Действует</span>
{% elif status == "expiring" %}
    <span class="badge bg-warning text-dark certificate-status certificate-status-expiring">
        Скоро истекает
    </span>
{% elif status == "expired" %}
    <span class="badge bg-danger certificate-status">Истек</span>
{% elif status == "revoked" %}
    <span class="badge bg-secondary certificate-status">Отозван</span>
{% else %}
    <span class="badge bg-info text-dark certificate-status">Еще не действует</span>
{% endif %}
